name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # 本番と同じバンドルを wrangler dev で起動し、モジュールのトップレベルのエラー(デプロイ時の検証エラー
      # 10021)を検出する。vitest と dev サーバーでは再現しない(PR #72)
      - run: pnpm --filter @plyrs/api check:deploy

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plyrs/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @plyrs/e2e test
